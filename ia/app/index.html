<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111418">
<title>AI JACK</title>
<link rel="icon" href="jack-ia.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script data-jack-world-nav src="../../jack-world-nav.js" defer></script>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.webmanifest"><script src="../../jack-appli.js" defer></script>
</head>
<body>
<div id="landscape" class="landscape" aria-hidden="true"></div>
<header class="top">
  <button id="openHistory" class="icon" type="button" aria-label="Mes discussions" title="Mes discussions">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
  </button>
  <div class="brand"><span class="bot" aria-hidden="true"><i></i><i></i></span>AI JACK</div>
  <div class="topActions">
    <button id="newChat" class="icon" type="button" aria-label="Nouvelle discussion" title="Nouvelle discussion">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h8M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
    </button>
    <button id="openSettings" class="icon" type="button" aria-label="Réglages" title="Réglages">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>
</header>

<main id="scroller">
  <section id="welcome" class="welcome">
    <span class="bot big" aria-hidden="true"><i></i><i></i></span>
    <h1>Salut, on fait quoi ?</h1>
    <div class="suggestions">
      <button type="button" data-prompt="Aide-moi à écrire un petit programme en Python qui ">Écrire un programme</button>
      <button type="button" data-prompt="Explique-moi simplement ">M'expliquer un truc</button>
      <button type="button" data-prompt="Donne-moi une idée de ">Trouver une idée</button>
      <button type="button" data-prompt="Corrige ce texte sans changer mon style :&#10;&#10;">Corriger un texte</button>
    </div>
  </section>
  <div id="messages" class="messages" aria-live="polite"></div>
</main>

<footer class="composerWrap">
  <section id="setup" class="setup" aria-live="polite" hidden>
    <p id="setupText"></p>
    <div id="setupBar" class="bar" hidden><i id="setupFill"></i></div>
    <button id="setupButton" class="primaryBtn" type="button" hidden></button>
  </section>
  <form id="composer" class="composer">
    <textarea id="prompt" rows="1" placeholder="Écris à Jack…" aria-label="Message pour Jack" maxlength="20000"></textarea>
    <div class="composerBar">
      <span id="brainBadge" class="badge" title="Le cerveau de Jack tourne dans ton navigateur">Sans Internet</span>
      <span class="spacer"></span>
      <button id="talk" class="icon" type="button" aria-label="Dicter" title="Dicter">
        <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
      </button>
      <button id="send" class="send" type="submit" aria-label="Envoyer" title="Envoyer">
        <svg class="arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        <svg class="square" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2"/></svg>
      </button>
    </div>
  </form>
  <p id="hint" class="hint">Gratuit, sans compte. Jack tourne dans ton navigateur et peut se tromper.</p>
</footer>

<dialog id="historyPanel" class="drawer">
  <div class="dialogHead"><h2>Mes discussions</h2><button class="icon" type="button" data-close aria-label="Fermer">✕</button></div>
  <div id="historyList" class="historyList"></div>
</dialog>

<dialog id="settingsPanel" class="modal">
  <div class="dialogHead"><h2>Réglages</h2><button class="icon" type="button" data-close aria-label="Fermer">✕</button></div>
  <label class="field">Cerveau de Jack
    <select id="size">
      <option value="leger">Léger · le plus rapide</option>
      <option value="rapide">Rapide · le bon équilibre (conseillé)</option>
      <option value="malin">Malin · plus intelligent, plus lent</option>
    </select>
  </label>
  <p id="sizeInfo" class="small"></p>
  <div class="row"><button id="forget" type="button">Supprimer les cerveaux téléchargés</button></div>
  <p class="small">Le cerveau se télécharge une seule fois, puis reste dans ce navigateur. Il faut Edge ou Chrome à jour (WebGPU).</p>
  <label class="field">Voix
    <select id="voice"></select>
  </label>
  <label class="check"><input id="autoSpeak" type="checkbox"> Lire les réponses à voix haute</label>
</dialog>

<script src="app.js"></script>
</body>
</html>
